# Benchmarks (Yahoo symbols). All strategies and the event study are judged against the
# primary one; the secondary (OMX Stockholm 30) is shown for reference and stays in the
# paper log's original bench_* columns, so v0's log is unchanged.
benchmark:
  primary: "nasdaq:IX3364"  # OMX Stockholm Small Cap PI via Nasdaq Nordic (Yahoo has no history); see README "Benchmark"
  secondary: "^OMX"         # OMX Stockholm 30
history_period: "6mo"
# Daily bars are only complete after the close (17:30). Runs before this Stockholm time ignore
# today's still-forming bar for scoring and paper trades, and use yesterday's instead.
complete_bar_after: "18:00"
volume_baseline_days: 60

thresholds:
  volume_mild: 3            # today's volume vs 60-day average
  volume_strong: 5
  price_move_1d: 0.10       # |1-day move| >= 10%
  news_spike_min_items: 3   # at least this many news items in 24h ...
  news_spike_multiplier: 3  # ... and >= 3x the daily average of the past week
  small_cap_max_sek: 5000000000   # 5 bn SEK
  hype_5d_move: 0.50        # +50% in 5 days with no company release = hype warning

alert_min_score: 3          # shown under "Alerts" in the digest

# Google News source names that count as a company release (case-insensitive substring).
# Verified 2026-10-06: Google News labels the wires "Cision News" (news.cision.com) and
# "storage.mfn.se". Coverage of these wires in Google News is very sparse, so expect
# most real releases to be missed; the direct MFN feed below is the primary source.
release_sources: [cision, mfn, globenewswire, inderes, nasdaq]

# Routine releases that carry no new information. A release whose title contains any of
# these (case-insensitive substring) is ignored for both the release signal and the hype
# check. Picked from real MFN titles for the watchlist, Swedish and English.
release_ignore_titles:
  - aktier och röster              # share/vote count updates
  - antal röster
  - shares and votes
  - share buybacks executed        # weekly buyback execution reports
  - återköp av egna aktier under
  - c-aktier för incitamentsprogram
  - valberedning                   # nomination committee
  - nomination committee
  - inbjudan till presentation     # report presentation invitations
  - presentation av
  - investerarpresentation
  - invitation to presentation

# Company releases straight from MFN, which also carries Cision-distributed releases.
# Per-company feed: https://mfn.se/all/a/<mfn_slug>.rss (mfn_slug column in watchlist.csv).
releases:
  enabled: true
  mfn_limit: 20             # newest items per request; enough to cover news.lookback_days

news:
  lookback_days: 7
  language: sv
  country: SE
  pause_seconds: 1.0        # politeness delay between news requests

paper_trading:
  enabled: true
  min_score: 4              # open a paper position at next open when score >= this
  take_profit: 0.30
  stop_loss: -0.15
  max_hold_days: 20         # trading days
  # Shadow variant, tracked next to the rules above (it never changes them): sell `fraction`
  # at take_profit, then move the stop on the rest to entry x (1 + remainder_stop). The rest
  # exits at that stop or after max_hold_days. Results go to the pe_* columns.
  partial_exit:
    enabled: true
    fraction: 0.5
    remainder_stop: 0.0     # 0 = breakeven
  # Entry filters for the v0b book only (v0 stays the unfiltered control). Added 2026-10-13,
  # after the first week's three stop-losses all followed an extreme move in a tiny, volatile
  # stock, two of them a re-buy right after a stop; v0b trades signalled before then used none.
  v0b_entry_filters:
    cooldown_days_after_stop: 10  # no buy within this many weekdays after a stop-out in the stock
    max_signal_move: 0.30         # no buy when |1-day move on the signal day| is larger

# Watchlist builder (python build_watchlist.py): Nasdaq Stockholm Small Cap + First North
# Stockholm, filtered on liquidity. Rows marked source=manual in watchlist.csv are always kept.
universe:
  segments: [SMALL_CAP, FIRST_NORTH]
  min_median_turnover_sek: 500000    # median daily close x volume over turnover_days
  turnover_days: 60
  min_history_days: 40               # fewer bars (new listings) -> sent to review instead

# evaluate.py: the judge of whether the signals beat the index after costs.
# Also used for the one-line verdict in the evening digest.
# Costs: see costs.* below (per side, all strategies). Closed trades needed: eval.min_trades.
evaluation:
  stake: 0.10               # share of the account per trade, for the drawdown figure
  digest_after_hour: 12     # Stockholm hour from which the digest shows the verdict (evening run)

# LLM release scoring experiment: v0 (current rules), v0b (MFN/Cision releases only),
# v1_<prompt_version> (v0b with LLM points instead of the flat +2, and blocking).
llm:
  enabled: false              # true = score releases with Claude (paid API, ANTHROPIC_API_KEY); false = free, no v1 book
  model: "claude-sonnet-5-5"
  prompt_version: "v1"        # prompts/score_<version>.md; never edit a used prompt, add a new version
  effort: "medium"            # fixed per prompt version (changing it needs a new version)
  score_from_date: "2026-10-08"   # go-live: only releases published from this date are scored
  max_calls_per_run: 50       # cost cap
  max_body_chars: 8000
  block_if_direction_lte: -2  # material release with direction <= this blocks a v1 buy that day
  skip_routine: true          # don't call the LLM for titles in release_ignore_titles (they score 0)
  points:                     # v1 replaces v0b's flat +2 for a release with these points
    material_direction_2: 3   # material and direction +2
    direction_1: 2            # direction +1
    other: 0                  # direction 0 / -1 / -2, or not material, or no scored release

# Trading costs for evaluation (all strategies), in percent per side. The bid-ask spread at
# signal time is logged when available (Nasdaq share list) and then replaces half_spread_pct.
costs:
  commission_pct: 0.1
  half_spread_pct: 0.5

eval:
  min_trades: 30              # per strategy, before PASS/FAIL
  min_events: 300             # event study, before PASS/FAIL of the comparison
  horizons: [1, 5, 20]        # trading days after entry

weekly_summary:
  enabled: true
  weekday: 4                # 0=Mon … 4=Fri. Generated once per ISO week, on the first run
  after_hour: 18            # at/after this Stockholm hour: Friday's bar is complete (complete_bar_after)
  lookback_weeks: 12        # rolling window for signal hit-rate (signals = score >= alert_min_score)
  horizons: [1, 5, 20]      # trading days after the signal-day close; hit = beat the benchmark
  notional_sek: 10000       # paper P&L shown as if every trade were this size

email:
  enabled: false            # set true and add SMTP_* / EMAIL_TO secrets to receive the digest
  send_when: always         # always | alerts
