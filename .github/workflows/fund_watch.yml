# Runs the code in this public repository and commits its output to the private data
# repository (kwagyei/stock-scanner-data). Moved here from the data repository on
# 2026-11-20, because scheduled runs in a private repository use up paid Actions minutes.
name: fund-risk-watch

on:
  schedule:
    # Every day (news happens at weekends too). 07:13 Stockholm summer / 06:13 winter.
    # Off the hour: GitHub can drop scheduled runs at busy times such as :00.
    - cron: "13 5 * * *"
  workflow_dispatch:          # "Run workflow" button, and the external timer (cron-job.org, see README)
    inputs:
      slot:
        description: "daily: skip if the fund watch already ran today (set by the external timer). Empty = always run"
        type: string
        default: ""
      test_email:
        description: "Send this run's report by e-mail even if nothing is flagged (checks the SMTP setup)"
        type: boolean
        default: false

# Runs here, in the public code repository, so it uses no paid Actions minutes; everything it
# writes goes to the private data repository through DATA_REPO_TOKEN (a fine-grained token
# with Contents: read and write on kwagyei/stock-scanner-data only). The logs here are public,
# so SCANNER_PUBLIC_RUN keeps the reports out of them and nothing is uploaded as an artifact.
permissions:
  contents: read

concurrency:
  group: fund-risk-watch
  cancel-in-progress: false

jobs:
  slot:
    # Timed runs (GitHub's schedule, or the external timer with slot=daily) are skipped if a
    # "fund watch ..." commit already landed today (Stockholm time). Manual runs always run.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: kwagyei/stock-scanner-data
          SLOT: ${{ inputs.slot || (github.event_name == 'schedule' && 'daily') || '' }}
        run: |
          if [ "$SLOT" != "daily" ]; then echo "Manual run: no slot check."; exit 0; fi
          day=$(TZ=Europe/Stockholm date +%Y-%m-%d)
          since=$(date -u -d "TZ=\"Europe/Stockholm\" $day 00:00" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$DATA_REPO/commits?sha=main&since=$since&per_page=100" \
                --jq '[.[] | select(.commit.message | startswith("fund watch "))] | length')
          echo "fund watch commits since $since: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already ran today; skipping."; fi

  watch:
    needs: slot
    # Only here: a fork has no DATA_REPO_TOKEN and must not try.
    if: needs.slot.outputs.skip != 'true' && github.repository == 'kwagyei/stock-scanner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # the private data repository: where the output goes
        with:
          repository: kwagyei/stock-scanner-data
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/checkout@v4            # this repository's code, latest main
        with:
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser PyYAML certifi pytest

      - name: Run tests
        working-directory: code
        run: python -m pytest -q fund-watch/tests

      - name: Run fund risk watch
        env:
          SCANNER_STATE_DIR: ${{ github.workspace }}
          SCANNER_PUBLIC_RUN: "1"                # reports stay out of these public logs
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python code/fund-watch/fund_watch.py ${{ inputs.test_email && '--test-email' || '' }}

      - name: Commit output
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add fund-watch/data/ fund-watch/reports/
          git diff --cached --quiet && exit 0
          git commit -m "fund watch $(date -u +%Y-%m-%d)"
          git pull --rebase   # the stock scanner commits here too
          git push
