name: fund-risk-watch

on:
  schedule:
    # Every day (news happens at weekends too). 07:13 Stockholm summer / 06:13 winter.
    # Off the hour: GitHub can drop scheduled runs at busy times such as :00.
    - cron: "13 5 * * *"
  workflow_dispatch:          # "Run workflow" button, and the external timer (cron-job.org, see README)
    inputs:
      slot:
        description: "daily: skip if the fund watch already ran today (set by the external timer). Empty = always run"
        type: string
        default: ""
      test_email:
        description: "Send this run's report by e-mail even if nothing is flagged (checks the SMTP setup)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fund-risk-watch
  cancel-in-progress: false

jobs:
  slot:
    # Timed runs (GitHub's schedule, or the external timer with slot=daily) are skipped if a
    # "fund watch ..." commit already landed today (Stockholm time). Manual runs always run.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ inputs.slot || (github.event_name == 'schedule' && 'daily') || '' }}
        run: |
          if [ "$SLOT" != "daily" ]; then echo "Manual run: no slot check."; exit 0; fi
          day=$(TZ=Europe/Stockholm date +%Y-%m-%d)
          since=$(date -u -d "TZ=\"Europe/Stockholm\" $day 00:00" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since&per_page=100" \
                --jq '[.[] | select(.commit.message | startswith("fund watch "))] | length')
          echo "fund watch commits since $since: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already ran today; skipping."; fi

  watch:
    needs: slot
    if: needs.slot.outputs.skip != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fund-watch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser PyYAML certifi pytest

      - name: Run tests
        working-directory: .
        run: python -m pytest -q fund-watch/tests

      - name: Run fund risk watch
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python fund_watch.py ${{ inputs.test_email && '--test-email' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: fund-watch
          path: fund-watch/reports/fund_watch_latest.html
          retention-days: 30

      - name: Commit seen-store and log
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/fund_watch_seen.json data/fund_watch_stories.json data/fund_watch_log.csv \
                  data/fund_watch_latest.json \
                  reports/fund_watch_latest.html reports/fund_watch_latest.md
          git diff --cached --quiet && exit 0
          git commit -m "fund watch $(date -u +%Y-%m-%d)"
          git pull --rebase   # the stock scanner commits to main too
          git push
