name: attention-scan

on:
  schedule:
    # GitHub cron runs in UTC, can start late and can drop runs at busy times (e.g. :00, :30),
    # so the times are off-peak and the morning has a backup. Morning runs must start before
    # the 09:00 open: new paper trades buy at the next open.
    - cron: "7 6 * * 1-5"     # 08:07 Stockholm summer / 07:07 winter
    - cron: "37 6 * * 1-5"    # backup: 08:37 summer / 07:37 winter, skipped if 08:07 ran
    - cron: "52 16 * * 1-5"   # 18:52 summer / 17:52 winter (after the 17:30 close)
    - cron: "58 17 7 10 *"    # TEMPORARY schedule test, 7 Oct 2026 19:58 Stockholm only; remove after
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      weekly:
        description: "Also build the weekly summary now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: attention-scan
  cancel-in-progress: false

jobs:
  slot:
    # Morning runs only: skip if a scan already completed this morning (it leaves a "scan ..."
    # commit). The concurrency group makes a second run wait until the first has finished.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: >-
          github.event_name == 'schedule' &&
          (github.event.schedule == '7 6 * * 1-5' || github.event.schedule == '37 6 * * 1-5')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u +%Y-%m-%d)T05:00:00Z"
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since&per_page=100" \
                --jq '[.[] | select(.commit.message | startswith("scan "))] | length')
          echo "scan commits since $since: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already scanned this morning; skipping."; fi

  scan:
    needs: slot
    if: needs.slot.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Run scanner
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scanner.py ${{ inputs.weekly && '--weekly' || '' }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: reports/latest.html
          retention-days: 30

      - name: Commit logs
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/ reports/ DASHBOARD.md   # digest_*.html are gitignored
          git diff --cached --quiet && exit 0
          git commit -m "scan $(date -u +%Y-%m-%d_%H%M)"
          git pull --rebase   # the fund risk watch commits to main too
          git push
