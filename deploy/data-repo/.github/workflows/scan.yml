# Lives in the private data repository (kwagyei/stock-scanner-data); kept here as the deployed version.
# Runs the public code and commits its output to the data repository.
name: attention-scan

on:
  schedule:
    # GitHub cron runs in UTC, can start late and can drop runs at busy times (e.g. :00, :30),
    # so the times are off-peak and the morning has a backup. Morning runs must start before
    # the 09:00 open: new paper trades buy at the next open.
    - cron: "7 6 * * 1-5"     # 08:07 Stockholm summer / 07:07 winter
    - cron: "37 6 * * 1-5"    # backup: 08:37 summer / 07:37 winter, skipped if 08:07 ran
    # Evening: must land after complete_bar_after (18:00 Stockholm) in winter too, or it scores
    # yesterday's bar and blocks the evening slot (tests/test_schedule.py checks both seasons).
    - cron: "7 17 * * 1-5"    # 19:07 summer / 18:07 winter (after the 17:30 close and the 18:00 bar cutoff)
  workflow_dispatch:          # "Run workflow" button, and the external timer (cron-job.org, see README)
    inputs:
      slot:
        description: "morning / evening: skip if that slot already has a scan (set by the external timer). Empty = always run"
        type: string
        default: ""
      weekly:
        description: "Also build the weekly summary now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: attention-scan
  cancel-in-progress: false

jobs:
  slot:
    # Timed runs (GitHub's schedule, or the external timer with slot=morning/evening) are skipped
    # if that slot already has a scan: a "scan ..." commit since 05:00 (morning) or 18:00
    # (evening) Stockholm time today. Manual runs always run. The concurrency group makes a
    # second run wait until the first has finished, so it sees the first one's commit.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: >-
            ${{ inputs.slot
                || (github.event.schedule == '7 17 * * 1-5' && 'evening')
                || (github.event_name == 'schedule' && 'morning') || '' }}
        run: |
          case "$SLOT" in
            morning) from="05:00" ;;
            evening) from="18:00" ;;   # = complete_bar_after: today's bar is final from then
            *) echo "Manual run: no slot check."; exit 0 ;;
          esac
          day=$(TZ=Europe/Stockholm date +%Y-%m-%d)
          if [ "$SLOT" = evening ] && [ "$(TZ=Europe/Stockholm date +%H:%M)" \< "$from" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Before $from Stockholm: too early for the evening slot (today's bar isn't complete); skipping."
            exit 0
          fi
          since=$(date -u -d "TZ=\"Europe/Stockholm\" $day $from" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since&per_page=100" \
                --jq '[.[] | select(.commit.message | startswith("scan "))] | length')
          echo "$SLOT slot: scan commits since $since: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already scanned in this slot; skipping."; fi

  scan:
    needs: slot
    if: needs.slot.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # this data repository: where the output goes

      - uses: actions/checkout@v4            # the code, always the latest main
        with:
          repository: kwagyei/stock-scanner
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - run: pip install -r code/requirements.txt pytest   # includes the Anthropic SDK

      - name: Run tests
        working-directory: code
        run: python -m pytest -q

      - name: Run scanner
        env:
          SCANNER_STATE_DIR: ${{ github.workspace }}
          SCANNER_CODE_URL: https://github.com/kwagyei/stock-scanner/blob/main
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # LLM release scoring; read by the SDK only
        run: python code/scanner.py ${{ inputs.weekly && '--weekly' || '' }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: reports/latest.html
          retention-days: 30

      - name: Commit output
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/ reports/ DASHBOARD.md   # digest_*.html are gitignored
          git diff --cached --quiet && exit 0
          git commit -m "scan $(date -u +%Y-%m-%d_%H%M)"
          git pull --rebase   # the fund risk watch commits here too
          git push
