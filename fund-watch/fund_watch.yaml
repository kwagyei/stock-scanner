# Fund risk news monitor – configuration

# Funds to watch. Each fund has its own holdings, dependencies, searches and relevance words;
# risk keywords and scoring below are shared. Articles are fetched once and scored per fund.
funds:
  - id: jpm_taiwan
    short: "Taiwan"
    icon: "🇹🇼"
    name: "JPMorgan Funds - Taiwan Fund A (acc) USD"
    isin: "LU0210528419"
    search_names: ["JPMorgan Taiwan Fund", "JPM Taiwan Fund"]
    # Top 10 from the JPMorgan factsheet "as at end August 2026" (published 21 Sep 2026):
    # am.jpmorgan.com/content/dam/jpm-am-aem/asiapacific/hk/en/literature/fact-sheet/jpmf-taiwan_e.pdf
    # (JPMorgan Funds - Taiwan Fund, share classes incl. A (acc) USD LU0210528419). Fund size USD 1,290m;
    # IT 74.6%, financials 14.8%, cash 5.8%. Single holdings are capped at 10% of the fund.
    # Update monthly. weight = % of fund; >= top_holding_min_weight gets holding_bonus.
    top_holding_min_weight: 3
    holdings:
      - {name: "TSMC", weight: 8.5, aliases: ["Taiwan Semiconductor"]}
      - {name: "MediaTek", weight: 7.8, aliases: []}
      - {name: "Largan Precision", weight: 4.6, aliases: ["Largan"]}
      - {name: "Delta Electronics", weight: 4.5, aliases: []}
      - {name: "Accton Technology", weight: 3.2, aliases: ["Accton"]}
      - {name: "King Slide Works", weight: 2.9, aliases: ["King Slide"]}
      - {name: "Hon Hai", weight: 2.7, aliases: ["Hon Hai Precision", "Foxconn"]}
      - {name: "Fubon Financial", weight: 2.7, aliases: ["Fubon"]}
      - {name: "SinoPac Financial", weight: 2.4, aliases: ["SinoPac"]}
      - {name: "KGI Financial", weight: 2.4, aliases: ["KGI Financial Holding"]}
      # Not in the August top 10 (so below 2.4% if still held); still watched.
      - {name: "Elite Material", weight: 0, aliases: ["Elite Material Co"]}
      - {name: "CTBC Financial", weight: 0, aliases: ["CTBC"]}
      - {name: "Quanta Computer", weight: 0, aliases: ["Quanta"]}
      - {name: "ASE Technology", weight: 0, aliases: ["ASE Holding", "ASE Technology Holding"]}
      - {name: "E.Sun Financial", weight: 0, aliases: []}
      - {name: "Mega Financial", weight: 0, aliases: []}
      - {name: "Cathay Financial", weight: 0, aliases: []}
    # Companies the holdings depend on. search_* = extra words for their news searches
    # (keeps them on-topic); leave out to not search for them separately.
    dependencies:
      customers: ["Nvidia", "Apple", "AMD", "Broadcom", "Qualcomm", "Microsoft", "Google", "Amazon", "Meta"]
      suppliers: ["ASML", "Applied Materials", "Tokyo Electron", "Lam Research"]
      search_customers: "(TSMC OR Taiwan OR chips OR orders)"
      search_suppliers: "(Taiwan OR TSMC OR China OR export)"
    # Words that tie an article to this fund (region_bonus, and needed for "flagged").
    relevance_terms: ["Taiwan", "Taiwanese", "Taipei", "TAIEX"]
    topics:
      - "Taiwan Strait"
      - "China Taiwan military"
      - "Taiwan blockade"
      - "Taiwan earthquake"
      - "Taiwan typhoon"
      - "Taiwan power outage"
      - "Taiwan water shortage"
      - "Taiwan strike workers"
      - "semiconductor export controls"
      - "chip tariffs"
      - "US China chip ban"
      - "TAIEX"
      - "Taiwan dollar"
      - "Taiwan stock market"
      - "AI capex spending"
      - "AI chip demand"
      - "semiconductor inventory"

  - id: avanza_global
    short: "Global"
    icon: "🌍"
    name: "Avanza Global"
    isin: "SE0011527613"
    search_names: ["Avanza Global"]
    # Index fund (Morningstar Developed Markets TME Paris Aligned Benchmark Sustainability Select),
    # about 1,000 developed-market stocks, priced in SEK and not currency-hedged.
    # Top 10 = about 30% of the fund. Source: Investing.com holdings page, data from 6 Oct 2026.
    # Check now and then against the fund page on avanza.se.
    top_holding_min_weight: 3
    holdings:
      - {name: "Apple", weight: 5.6, aliases: [],
         exclude: ["apples?\\s+(crop|crops|orchards?|harvest|growers?|farmers?|pie|cider|juice|picking)",
                   "big apple", "apple (orchard|tree)s?"]}
      - {name: "Nvidia", weight: 5.6, aliases: []}
      - {name: "Microsoft", weight: 4.6, aliases: []}
      - {name: "Alphabet", weight: 4.4, aliases: ["Google"],
         exclude: ["preferred source on google", "add us on google", "google news", "on google play"]}
      - {name: "Amazon", weight: 3.5, aliases: ["Amazon.com"]}
      - {name: "Broadcom", weight: 1.6, aliases: []}
      - {name: "Meta Platforms", weight: 1.6, aliases: ["Meta"]}
      - {name: "Micron", weight: 1.5, aliases: []}
      - {name: "Tesla", weight: 1.5, aliases: []}
    # TSMC makes the chips for Nvidia, Apple, Broadcom and others. Not searched separately:
    # the Taiwan fund's searches already fetch TSMC news, and every article is scored for both funds.
    dependencies:
      customers: []
      suppliers: ["TSMC", "Taiwan Semiconductor"]
    # A broad index moves with the market as a whole, and in SEK with the krona.
    # Index fund: single-company legal, labour and results news rarely moves it; the market,
    # rates and the krona do. Category severities for this fund (others as in risk_categories),
    # and it flags from score 4.
    severity: {legal_regulatory: 1, labour: 1, cyber_operations: 1, macro: 3, market_stress: 2}
    flag_min_score: 4
    relevance_terms: ["Wall Street", "S&P 500", "Nasdaq", "Dow Jones", "Federal Reserve", "Fed",
                      "US stocks", "global stocks", "world stocks", "MSCI World", "Magnificent Seven",
                      "krona", "Swedish krona"]
    topics:
      - "Federal Reserve interest rates"
      - "US recession"
      - "stock market selloff"
      - "Nasdaq selloff"
      - "AI bubble"
      - "Magnificent Seven stocks"
      - "big tech antitrust"
      - "US tariffs stocks"
      - "Swedish krona dollar"
      - "global stocks"

# Risk categories. Keywords are matched as whole words/phrases, case-insensitive.
# severity: 3 = high, 2 = medium, 1 = low
risk_categories:
  geopolitics:
    severity: 3
    # "war" alone matched Taiwan's annual war games; use phrases instead.
    keywords: ["blockade", "invasion", "invade", "war with", "go to war", "all-out war", "act of war",
               "war over Taiwan", "military drills", "live-fire", "PLA", "missile", "warships", "incursion",
               "quarantine", "annexation", "embargo", "armed conflict", "military conflict", "tensions escalate"]
  trade_restrictions:
    severity: 3
    keywords: ["export controls", "export control", "export ban", "ban", "banned", "tariff", "tariffs",
               "sanction", "sanctions", "entity list", "restriction", "restrictions", "Section 232",
               "license requirement", "trade war", "retaliation", "countermeasures"]
  natural_disaster:
    severity: 3
    # Taiwan has small quakes almost daily; only strong ones count (magnitude 6+ or described as such).
    keywords: ["strong earthquake", "major earthquake", "powerful earthquake", "deadly earthquake",
               "strong quake", "major quake", "powerful quake", "deadly quake",
               "magnitude 6", "magnitude 7", "magnitude 8", "mag. 6", "mag. 7", "mag. 8",
               "tsunami", "typhoon", "flood", "flooding", "landslide", "drought", "water shortage", "water rationing"]
  infrastructure:
    severity: 2
    # bare "fire" / "shutdown" matched "fires CEO", "under fire", "government shutdown"
    keywords: ["power outage", "blackout", "power cut", "grid failure", "factory fire", "plant fire", "fab fire",
               "fire broke out", "blaze", "explosion", "contamination", "gas leak", "evacuated", "evacuates",
               "evacuation", "halts production", "halted production", "production halt", "suspends production",
               "plant shutdown", "factory shutdown", "production shutdown"]
  labour:
    severity: 2
    keywords: ["strike", "strikes", "walkout", "labor dispute", "labour dispute", "union protest",
               "layoffs", "job cuts", "worker shortage"]
    # "Google, Constellation strike nuclear deal", "missile strike", "strike price" aren't labour news
    exclude: ["strikes?\\s+(an?\\s+)?(\\S+\\s+){0,4}(deal|deals|agreement|pact|partnership)",
              "(missile|air|drone|military|lightning)\\s+strikes?", "strike price", "strikes? back"]
  demand_and_customers:
    severity: 2
    keywords: ["cuts orders", "cut orders", "order cuts", "cancels orders", "cancelled orders",
               "pulls out of", "relocate", "relocates", "shifts production",
               "moves production", "capex cut", "cuts spending", "spending slowdown", "demand slowdown",
               # "AI bubble" alone matched daily commentary ("fears overblown"); only a burst counts
               "inventory glut", "oversupply", "excess inventory", "AI bubble bursts", "AI bubble burst",
               "AI bubble bursting", "AI bubble pops", "AI bubble popping",
               "delays shipments", "delays orders", "delays production", "shipment delays", "delayed shipments",
               "halts construction"]
  company_results:
    severity: 2
    keywords: ["profit warning", "cuts guidance", "lowers guidance", "lowers forecast", "cuts forecast",
               "misses estimates", "missed estimates", "revenue falls", "revenue drops", "sales fall",
               "sales decline", "profit falls", "loss widens", "downgrade", "downgraded", "weak outlook",
               "disappointing"]
  legal_regulatory:
    severity: 2
    keywords: ["lawsuit", "sued", "fined", "fines", "antitrust", "probe", "investigation", "indicted",
               "raid", "subpoena", "trade secrets", "espionage", "penalty"]
  cyber_operations:
    severity: 2
    keywords: ["cyberattack", "cyber attack", "ransomware", "hack", "hacked", "data breach", "outage",
               "defect", "recall", "yield problems", "yield issues"]
  market_stress:
    severity: 1
    # bare "crash" matched traffic accidents ("major crash involving Amazon truck")
    keywords: ["sell-off", "selloff", "plunge", "plunges", "tumbles", "slumps", "rout", "market crash",
               "stock market crash", "stocks crash", "shares crash", "flash crash", "crash in stocks",
               "outflows", "foreign selling", "volatility", "slide", "slides", "slump", "falls sharply"]
    exclude: ["(plane|car|air|jet|helicopter|train|truck|bus|motorcycle|fatal|deadly|cargo)\\s+crash(es)?",
              "crash\\s+(attorneys?|lawyers?|victims?|site|investigat\\w+|probe)",
              "(sell-?off|selloff|slump|slide)\\s+(eases|fades|ends|eased|faded|ended)"]
  macro:
    severity: 2
    # event wording only: "rate hike odds recede" or "how many hikes are left?" aren't events
    keywords: ["recession", "raises rates", "hikes rates", "raises interest rates", "surprise hike", "stagflation",
               "credit crunch", "bank failure", "bank run", "debt crisis", "bond rout", "yields surge",
               "yields soar", "inflation surges", "inflation jumps", "hot inflation",
               "krona strengthens", "krona surges", "krona rallies", "dollar slumps", "dollar tumbles",
               "dollar weakens"]
  fund_specific:
    severity: 3
    keywords: ["manager change", "portfolio manager leaves", "fund suspended", "suspends dealing",
               "liquidation", "fund merger", "merged", "closes fund"]

# Direction: is a flagged story likely good (▲) or bad (▼) for the fund? Keyword rules on the
# headline and summary, matched like the risk keywords (whole words, any case).
#   positive and negative phrases both found -> mixed (↕); none -> the category lean below,
#   if all the story's categories lean the same way; otherwise unclear (·).
# A phrase inside a longer phrase of the other kind doesn't count: "lifts ban" is positive, its
# "ban" isn't negative. It's a rough guide from headlines, not a forecast; the log keeps every
# label so it can be checked against the funds' prices later.
direction:
  positive: ["beats estimates", "beat estimates", "beats expectations", "tops estimates", "record revenue",
             "record profit", "record sales", "record high", "raises guidance", "raises forecast",
             "raises outlook", "lifts guidance", "lifts forecast", "upgrade", "upgraded", "buyback",
             "share repurchase", "wins order", "wins contract", "new orders", "orders surge", "demand surges",
             "strong demand", "sales rise", "sales jump", "revenue rises", "revenue jumps", "revenue grows",
             "profit rises", "profit jumps", "profit surges", "rallies", "stocks rally", "shares rally", "rebounds", "rebound",
             "surges", "soars", "soar", "surge", "jumps", "climbs", "gains", "blockbuster", "record year",
             "record quarter", "strike suspension", "suspends strike", "strike suspended", "lifts ban", "lifted ban", "ban lifted",
             "eases restrictions", "eased restrictions", "removes tariffs", "tariff cut", "tariff cuts",
             "cuts tariffs", "lowers tariffs", "tariff exemption", "exempted", "exemption", "trade deal",
             "truce", "ceasefire", "de-escalation", "tensions ease", "talks resume", "strike ends",
             "ends strike", "end strike", "ended strike", "calls off strike", "called off strike", "averts strike", "strike averted", "deal reached", "settles lawsuit",
             "settlement", "approval", "approved", "cuts rates", "rate cut", "rate cuts", "inflation cools",
             "inflation eases", "soft landing", "stimulus", "expands capacity", "new fab", "invests"]
  negative: ["misses estimates", "missed estimates", "cuts guidance", "lowers guidance", "cuts forecast",
             "lowers forecast", "cuts outlook", "weak outlook", "profit warning", "downgrade", "downgraded",
             "revenue falls", "revenue drops", "sales fall", "sales decline", "profit falls", "loss widens",
             "plunges", "plunge", "tumbles", "slumps", "slump", "slides", "slide", "sinks", "falls sharply",
             "sell-off", "selloff", "rout", "market crash", "shares crash", "stocks crash", "limit-down", "ban", "banned", "export controls",
             "export ban", "sanctions", "tariff", "tariffs", "entity list", "restrictions", "probe",
             "investigation", "lawsuit", "sued", "fined", "indicted", "raid", "strike", "walkout",
             "layoffs", "job cuts", "cuts orders", "cut orders", "orders cut", "order cuts", "cancels orders", "inventory glut",
             "oversupply", "delays", "delayed", "halts production", "suspends production", "outage",
             "blackout", "explosion", "factory fire", "plant fire", "fab fire", "recall", "defect", "cyberattack", "ransomware", "hacked",
             "data breach", "blockade", "invasion", "military drills", "live-fire", "missile", "incursion",
             "embargo", "escalates", "escalation", "tensions rise", "earthquake", "quake", "typhoon",
             "flood", "flooding", "drought", "water shortage", "recession", "stagflation", "hikes rates",
             "raises rates", "rate hike", "inflation surges", "inflation jumps", "debt crisis",
             "delinquencies", "defaults", "debt soars", "debt surges", "debt jumps", "costs soar", "costs surge",
             "prices soar", "prices surge", "inflation soars", "yields soar", "yields jump", "bank failure", "credit crunch", "yields surge"]
  # Used only when no phrase above matched.
  category_lean:
    geopolitics: negative
    trade_restrictions: negative
    natural_disaster: negative
    infrastructure: negative
    cyber_operations: negative
    labour: negative

# Scoring
scoring:
  holding_bonus: 2         # headline names a top-5 holding (weight >= 3%)
  other_holding_bonus: 1   # names another watched holding
  dependency_bonus: 1      # names a customer/supplier
  region_bonus: 1          # mentions one of the fund's relevance_terms (Taiwan / Wall Street / krona ...)
  flag_min_score: 3        # items below this go to "watch" instead of "flagged"
  require_relevance: true  # flag only if a relevance term, the fund, a holding or a dependency is named;
                           # other keyword matches (e.g. a quake in India) go to "watch"

news:
  lookback: "2d"           # Google News window; overlap is removed with the seen-store
  language: "en-US"
  country: "US"
  pause_seconds: 1.0
  # Headlines about the same story are grouped into one item (0..1; higher = only very similar
  # headlines merge). 0.5 merged 19 of 22 headlines on one strike story with no wrong merges
  # in a 2,800-article sample; 0.45 started merging different stories. Above 1 = no grouping.
  story_similarity: 0.5
  # Stories are remembered this many days after their last new headline. A remembered story with
  # new headlines shows as "still developing" (no new flag) unless it scores or rates higher.
  story_memory_days: 7
  seen_retention_days: 30

email:
  enabled: true            # needs the SMTP_* / EMAIL_TO repository secrets (see FUND_WATCH.md)
  send_when: flagged       # always | flagged
